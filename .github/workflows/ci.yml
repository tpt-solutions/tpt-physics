name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    name: Build & test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull the sibling workspaces so the path deps in Cargo.toml resolve.
          submodules: recursive
      - name: Checkout sibling repos (tpt-math, tpt-fem)
        run: |
          gh_repo="https://github.com/tpt-solutions"
          for r in tpt-math tpt-fem; do
            if [ ! -d "../$r" ]; then
              git clone --depth 1 "$gh_repo/$r" "../$r" || echo "warning: clone of $r failed"
            fi
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        # Long LBM steady-state validation is #[ignore]d; run normally fast suite.
        run: cargo test --workspace

  lint:
    name: Clippy & fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout sibling repos (tpt-math, tpt-fem)
        run: |
          gh_repo="https://github.com/tpt-solutions"
          for r in tpt-math tpt-fem; do
            if [ ! -d "../$r" ]; then
              git clone --depth 1 "$gh_repo/$r" "../$r" || echo "warning: clone of $r failed"
            fi
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: License audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check
