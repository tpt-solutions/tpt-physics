[package]
name = "tpt-phys-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Foundational physics data: type-safe material database and CAD ingestion adapter for tpt-physics."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["physics", "materials", "cad", "mesh", "fem"]
categories = ["science", "mathematics", "simulation"]

[dependencies]
tpt-math-units = { workspace = true }
tpt-fem-mesh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# Optional: Monte-Carlo uncertainty quantification over material property
# scatter. Gated behind the `uq` feature so consumers that don't need it pay
# no `proptest` dependency cost.
proptest = { workspace = true, optional = true }

[features]
default = []
uq = ["dep:proptest"]

[[example]]
name = "uq_cantilever"
required-features = ["uq"]

[[example]]
name = "uq_natural_frequency"
required-features = ["uq"]

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
