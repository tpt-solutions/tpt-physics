[package]
name = "tpt-physics-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "WebAssembly bindings for the tpt-physics DEM and CFD solvers (WebGL playground)."
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { workspace = true }
serde_json = "1"
console_error_panic_hook = "0.1"
tpt-physics-dem = { path = "../tpt-physics-dem" }
tpt-physics-cfd = { path = "../tpt-physics-cfd" }

[features]
default = []
