[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "tpt_physics"
description = "Python bindings for the tpt-physics simulation framework (DEM + FEA)."
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }

[tool.maturin]
features = ["pyo3/extension-module"]
