[package]
name = "tpt-physics-py"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
description = "Python (PyO3) binding over the tpt-phys DEM World (and tpt-phys-core material registry)"
authors = ["TPT Solutions"]
publish = false

[lib]
name = "tpt_physics_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.22"
serde_json = "1"
tpt-phys-core = { path = "../../crates/tpt-phys-core" }
tpt-phys-dem = { path = "../../crates/tpt-phys-dem" }
